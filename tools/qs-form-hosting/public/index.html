<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8dfe8">
  <meta name="description" content="Cotizador y agenda de reservas de Qamiluna Studio">
  <link rel="icon" type="image/jpeg" href="/assets/qamiluna-logo.jpg">
  <link rel="apple-touch-icon" href="/assets/qamiluna-logo.jpg">
  <title>Qamiluna Studio | Cotizador y Agenda</title>
  <link rel="stylesheet" href="/assets/app.css?v=20260724-2">
</head>
<body>
  <main class="app-shell">
    <div class="loading" data-loading role="status" aria-live="polite">
      <img src="/assets/qamiluna-logo.jpg" alt="" width="72" height="72">
      <strong>Cargando Cotizador QS</strong>
      <span>Consultando servicios y tarifas vigentes...</span>
      <span class="loading__dots" aria-hidden="true">&#8226; &#8226; &#8226;</span>
    </div>

    <iframe
      class="app-frame"
      data-app-frame
      title="Cotizador y Agenda QS"
      src="https://script.google.com/macros/s/AKfycbyMDp1W9W-PiHjpFMsLtBcH0NKd9IdU_1v-csstpclP8tzkYolk4u2FpUIaKs7TQCWz/exec"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-write"
    ></iframe>

    <section class="load-error" data-load-error hidden>
      <img src="/assets/qamiluna-logo.jpg" alt="Qamiluna Studio" width="72" height="72">
      <h1>No pudimos cargar el cotizador</h1>
      <p>Intenta nuevamente. Tus datos no se han enviado ni se ha creado una reserva.</p>
      <button type="button" data-retry>Reintentar</button>
    </section>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
