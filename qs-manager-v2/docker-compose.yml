services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: qs-manager-v2-app
    working_dir: /var/www/app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_NAME: "QS Manager V2"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: qs_manager_v2
      DB_USER: qs_user
      DB_PASSWORD: qs_password
      EXTERNAL_SERVICES_ENABLED: "false"
      LLM_ENABLED: "false"
      QDRANT_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
      # GAS oficial de la cuenta del estudio. No usar despliegues personales.
      GAS_WEBAPP_URL: "${GAS_WEBAPP_URL:-https://script.google.com/macros/s/AKfycbwiV_i0haP4lAQ2ZDrCoR28IWfUODpYlimNswDVBs2DNNnBSt2XPq38aOWhnWQsb4Zyiw/exec}"
      SHEETS_WRITE_SYNC_ENABLED: "${SHEETS_WRITE_SYNC_ENABLED:-false}"
      GAS_CATALOG_WEBAPP_URL: "${GAS_CATALOG_WEBAPP_URL:-}"
      GAS_CATALOG_SECRET: "${GAS_CATALOG_SECRET:-}"
      SHEETS_READ_SYNC_ENABLED: "true"
    volumes:
      - ./:/var/www/app
      - qs_manager_v2_vendor:/var/www/app/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: qs-manager-v2-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: qs_manager_v2
      POSTGRES_USER: qs_user
      POSTGRES_PASSWORD: qs_password
    volumes:
      - qs_manager_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qs_user -d qs_manager_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: qs-manager-v2-worker
    working_dir: /var/www/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: qs_manager_v2
      DB_USER: qs_user
      DB_PASSWORD: qs_password
      EXTERNAL_SERVICES_ENABLED: "false"
      SHEETS_READ_SYNC_ENABLED: "true"
    volumes:
      - ./:/var/www/app
      - qs_manager_v2_vendor:/var/www/app/vendor
    depends_on:
      db:
        condition: service_healthy
    command: php tools/sync-worker.php
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/qs-sync-worker.heartbeat && find /tmp/qs-sync-worker.heartbeat -mmin -1 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 3

  db_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: qs_manager_v2_test
      POSTGRES_USER: qs_test
      POSTGRES_PASSWORD: qs_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qs_test -d qs_manager_v2_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles: ["test"]
    environment:
      APP_ENV: test
      DB_HOST: db_test
      DB_PORT: 5432
      DB_NAME: qs_manager_v2_test
      DB_USER: qs_test
      DB_PASSWORD: qs_test
    volumes:
      - ./:/var/www/app
      - qs_manager_v2_vendor:/var/www/app/vendor
    depends_on:
      db_test:
        condition: service_healthy
    command: vendor/bin/phpunit

volumes:
  qs_manager_v2_pgdata:
  qs_manager_v2_vendor:
